
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAMS - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <!-- EAMS BRANDING -->
        <div class="company-brand">

            <div class="company-icon">
                <svg viewBox="0 0 64 64" width="58" height="58"
                     fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <rect x="7" y="18" width="50" height="37" rx="5"/>
                    <path d="M23 19V12C23 9 25 7 28 7H36C39 7 41 9 41 12V19H37V12H27V19H23Z"/>
                    <path d="M7 31L28 39V35H36V39L57 31V36L36 44H28L7 36V31Z" fill="#F5F0E8"/>
                    <rect x="27" y="35" width="10" height="6" rx="1" fill="#F5F0E8"/>
                </svg>
            </div>

            <div class="brand-divider"></div>

            <div class="brand-text">
                <h1>EAMS</h1>
                <p>Employee Attendance<br>Management System</p>
            </div>

        </div>

        <div class="brand-line"></div>

        <!-- LOGIN TITLE -->
        <h2 class="login-heading">Login to EAMS</h2>

        <!-- LOGIN FORM -->
        <form id="loginForm">

            <!-- ROLE -->
            <div class="form-group mb-3">
                <label for="loginRole">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="7" r="4"/>
                        <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
                    </svg>
                    Login As
                </label>

                <select id="loginRole" name="loginRole" class="form-control" required>
                    <option value="admin">Administrator</option>
                    <option value="employee">Employee</option>
                </select>
            </div>

            <!-- USERNAME -->
            <div class="form-group mb-3">
                <label for="username">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="7" r="4"/>
                        <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
                    </svg>
                    Username
                </label>

                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required>
            </div>

            <!-- PASSWORD -->
            <div class="form-group mb-3">
                <label for="password">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="10" width="16" height="12" rx="2"/>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                        <circle cx="12" cy="16" r="1" fill="currentColor"/>
                    </svg>
                    Password
                </label>

                <div class="password-wrapper">
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>

                    <button type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password">

                        <svg viewBox="0 0 24 24">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                            <path class="eye-slash" d="M3 3l18 18"/>
                        </svg>
                    </button>
                </div>
            </div>

            <p id="errorMessage" class="error-message" role="alert"></p>

            <button type="submit" class="login-button">Login</button>

        </form>

        <!-- LOGIN INFORMATION -->
        <div class="login-information">

            <h5>Login Information</h5>

            <div class="credential">
                <strong>Administrator</strong>
                <span>:</span>
                <p>Username: admin&nbsp; | &nbsp;Password: admin123</p>
            </div>

            <div class="credential">
                <strong>Employee</strong>
                <span>:</span>
                <p>Username: Employee ID (e.g. EMP001)&nbsp; | &nbsp;Password: emp123</p>
            </div>

        </div>

        <!-- FOOTER -->
        <footer>
            © 2026 EAMS. All Rights Reserved.
        </footer>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
